<article
  class="study-card"
  [attr.aria-labelledby]="'study-card-title-' + studyArea.id"
>
  <header class="study-card__header">
    <div>
      <h2
        class="study-card__title"
        [id]="'study-card-title-' + studyArea.id"
      >
        {{ studyArea.name }}
      </h2>

      <span class="study-card__goal">
        Meta semanal:
        {{ formatMinutes(studyArea.weeklyGoalMinutes) }}
      </span>
    </div>
  </header>
</article>
