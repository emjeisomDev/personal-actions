services:
  - type: web
    name: personal-actions-api
    runtime: node
    plan: free

    buildCommand: npm ci && npm run build

    preDeployCommand: npm run db:migrate

    startCommand: node dist/server.js

    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      - key: CORS_ORIGIN
        sync: false

      - key: DATABASE_URL
        fromDatabase:
          name: personal-actions-postgres
          property: connectionString

databases:
  - name: personal-actions-postgres
    databaseName: personal_actions_db